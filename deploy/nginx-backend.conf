# Reverse proxy for the backend, on a subdomain (e.g. api.yourdomain.com).
# Install to /etc/nginx/sites-available/sales-agent-backend and symlink into
# sites-enabled, then run `sudo certbot --nginx -d api.yourdomain.com` -
# certbot rewrites this file in place to add the HTTPS server block and a
# port-80-to-443 redirect, so only the plain HTTP block is needed here.

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File uploads can take a moment to parse; chat responses can take
        # 1-3 minutes on local CPU Ollama - don't let nginx time out first.
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
}
